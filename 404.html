<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — command not found | Rishant Shukla</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preload" href="assets/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <!-- the real stylesheet, so this page gets the typeface and the theme the
       visitor already chose instead of looking like a different site -->
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('portfolio-theme');
        if (t && ['tokyo-night','dracula','gruvbox','nord','matrix'].indexOf(t) > -1) {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* this page has no scrollback, so the window sizes to its content */
    #terminal-window { height: auto; max-height: 92vh; }
    #terminal { padding: 26px 28px 30px; }
    .nf-line { color: var(--fg); font-size: 13.5px; line-height: 1.9; }
    .nf-url  { color: var(--yellow); word-break: break-all; }
    .nf-err  { color: var(--red); }
    .nf-links { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
    .nf-links a {
      color: var(--blue); text-decoration: none; font-size: 13px;
      border: 1px solid var(--border); border-radius: 6px; padding: 7px 13px;
      transition: border-color .15s var(--ease-out), color .15s var(--ease-out);
    }
    .nf-links a:hover { border-color: var(--blue); color: var(--fg-bright); }
    .nf-links a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="particles-js" aria-hidden="true"></div>

  <div id="terminal-window">
    <div id="title-bar">
      <div id="title-bar-left">
        <span class="tb-dot tb-red"></span>
        <span class="tb-dot tb-yellow"></span>
        <span class="tb-dot tb-green"></span>
      </div>
      <div id="title-bar-center">rishant@devops: ~ (ssh)</div>
      <div id="title-bar-right"></div>
    </div>

    <div id="terminal">
      <h1 class="sr-only">404 — page not found</h1>

      <div class="prompt-line">
        <span class="user">rishant</span><span class="at">@</span><span class="host">devops</span><span class="arrow">➜</span>
        <span class="cmd">cat <span class="nf-url" id="requested-path">…</span></span>
      </div>
      <div class="nf-line nf-err">cat: no such file or directory</div>
      <div class="nf-line" style="color:var(--fg-dim);">HTTP/1.1 404 — that path is not part of this site.</div>

      <div class="prompt-line" style="margin-top:18px;">
        <span class="user">rishant</span><span class="at">@</span><span class="host">devops</span><span class="arrow">➜</span>
        <span class="cmd">cd ~</span>
      </div>

      <nav class="nf-links" aria-label="Go back">
        <a href="/">← back to the terminal</a>
        <a href="/?run=whoami">about</a>
        <a href="/?run=experience">experience</a>
        <a href="/?run=ls+projects">case studies</a>
        <a href="/?run=contact">contact</a>
      </nav>
    </div>
  </div>

  <script>
    // show what they actually asked for, escaped by assigning to textContent
    document.getElementById('requested-path').textContent =
      location.pathname.slice(0, 120) + location.search.slice(0, 60);
  </script>
</body>
</html>
